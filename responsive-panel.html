<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Responsive Options Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .sidebar-panel {
      width: 380px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0;
      box-sizing: border-box;
      height: calc(100vh - 40px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    
    /* Device Header */
    .device-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px 24px;
      border-radius: 16px 16px 0 0;
      text-align: center;
      position: relative;
    }
    .device-title {
      font-size: 1.4em;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .device-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }
    .device-tab {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .device-tab.active {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    /* Content Area */
    .content-area {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }
    
    /* Property Groups */
    .property-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .property-group:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(103, 126, 234, 0.3);
    }
    
    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .group-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .group-title {
      font-size: 1.1em;
      font-weight: 600;
      margin: 0;
      color: #e0e6ed;
      letter-spacing: 0.3px;
    }
    
    /* Input Rows */
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
      align-items: end;
    }
    .input-row.single {
      grid-template-columns: 1fr;
    }
    .input-row.triple {
      grid-template-columns: 1fr 1fr 1fr;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    label {
      font-size: 0.85em;
      margin-bottom: 6px;
      color: #9ca3af;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    
    /* Input Styles */
    .input-with-unit {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-unit input,
    input[type="text"],
    select {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95em;
      width: 100%;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .input-with-unit input {
      padding-right: 32px;
    }
    .input-with-unit input:focus,
    input[type="text"]:focus,
    select:focus {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.1);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .input-with-unit .unit {
      position: absolute;
      right: 12px;
      color: #9ca3af;
      font-size: 0.85em;
      pointer-events: none;
      font-weight: 500;
    }
    
    /* Buttons */
    .reset-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.85em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    
    /* Color Picker */
    .color-picker-block {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .no-color {
      color: #9ca3af;
      font-weight: 500;
      font-size: 0.9em;
      margin-bottom: 16px;
      display: block;
      letter-spacing: 0.3px;
    }
    .color-picker-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    .color-swatch:hover {
      transform: scale(1.1);
      border-color: #667eea;
    }
    .color-swatch.selected {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }
    
    .clear-btn {
      background: none;
      color: #9ca3af;
      border: none;
      font-weight: 500;
      font-size: 0.9em;
      cursor: pointer;
      margin-top: 12px;
      padding: 8px 0;
      transition: color 0.3s ease;
    }
    .clear-btn:hover {
      color: #fff;
    }
    
    /* Border Radius Grid */
    .border-radius-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .border-radius-item {
      display: flex;
      flex-direction: column;
    }
    .border-radius-label {
      font-size: 0.8em;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    /* Scrollbar */
    .sidebar-panel::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-panel::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    .sidebar-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    @media (max-width: 500px) {
      body {
        padding: 10px;
      }
      .sidebar-panel {
        width: 100%;
        height: calc(100vh - 20px);
      }
      .input-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .input-row.triple {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-panel">
    <!-- Device Header -->
    <div class="device-header">
      <h1 class="device-title">Desktop</h1>
      <div class="device-tabs">
        <button class="device-tab active">Desktop</button>
        <button class="device-tab">Tablet</button>
        <button class="device-tab">Mobile</button>
      </div>
    </div>
    
    <!-- Content Area -->
    <div class="content-area">
      
      <!-- Layout & Positioning (Most Important) -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">📐</div>
          <h3 class="group-title">Layout & Positioning</h3>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Position</label>
            <select>
              <option>Static</option>
              <option>Relative</option>
              <option>Absolute</option>
              <option>Fixed</option>
              <option>Sticky</option>
            </select>
          </div>
          <div class="input-group">
            <label>Display</label>
            <select>
              <option>Block</option>
              <option>Flex</option>
              <option>Grid</option>
              <option>Inline</option>
              <option>Inline-Block</option>
              <option>None</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Width</label>
            <div class="input-with-unit">
              <input type="text" placeholder="Auto">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>Height</label>
            <div class="input-with-unit">
              <input type="text" placeholder="Auto">
              <span class="unit">px</span>
            </div>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Z-Index</label>
            <input type="text" placeholder="Auto">
          </div>
          <div class="input-group">
            <label>Order</label>
            <input type="text" placeholder="0">
          </div>
        </div>
      </div>

      <!-- Typography -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">Aa</div>
          <h3 class="group-title">Typography</h3>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Font Size</label>
            <div class="input-with-unit">
              <input type="text" placeholder="16">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>Line Height</label>
            <div class="input-with-unit">
              <input type="text" placeholder="1.5">
              <span class="unit">em</span>
            </div>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Letter Spacing</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>Text Align</label>
            <select>
              <option>Left</option>
              <option>Center</option>
              <option>Right</option>
              <option>Justify</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Spacing -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">📏</div>
          <h3 class="group-title">Spacing</h3>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Padding</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <button class="reset-btn">Reset</button>
        </div>
        <div class="input-row triple">
          <div class="input-group">
            <label>Margin Top</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>Margin Right</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="input-group">
            <label>Margin Bottom</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
        </div>
        <div class="input-row single">
          <div class="input-group">
            <label>Margin Left</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Visual Effects -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">🎨</div>
          <h3 class="group-title">Visual Effects</h3>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Border Style</label>
            <select>
              <option>None</option>
              <option>Solid</option>
              <option>Dashed</option>
              <option>Dotted</option>
              <option>Double</option>
            </select>
          </div>
          <div class="input-group">
            <label>Border Width</label>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
        </div>
        <div class="input-row single">
          <div class="input-group">
            <label>Border Color</label>
            <div class="color-picker-block">
              <span class="no-color">No Color Selected</span>
              <div class="color-picker-row">
                <span class="color-swatch" style="background: #667eea;"></span>
                <span class="color-swatch" style="background: #764ba2;"></span>
                <span class="color-swatch" style="background: #ff6b6b;"></span>
                <span class="color-swatch" style="background: #4ecdc4;"></span>
                <span class="color-swatch" style="background: #45b7d1;"></span>
                <span class="color-swatch" style="background: #f9ca24;"></span>
              </div>
              <button class="clear-btn">Clear</button>
            </div>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Opacity</label>
            <div class="input-with-unit">
              <input type="text" placeholder="1">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="input-group">
            <label>Overflow</label>
            <select>
              <option>Visible</option>
              <option>Hidden</option>
              <option>Scroll</option>
              <option>Auto</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Border Radius -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">⭕</div>
          <h3 class="group-title">Border Radius</h3>
        </div>
        <div class="border-radius-grid">
          <div class="border-radius-item">
            <div class="border-radius-label">Top Left</div>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="border-radius-item">
            <div class="border-radius-label">Top Right</div>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="border-radius-item">
            <div class="border-radius-label">Bottom Left</div>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="border-radius-item">
            <div class="border-radius-label">Bottom Right</div>
            <div class="input-with-unit">
              <input type="text" placeholder="0">
              <span class="unit">px</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Advanced Properties -->
      <div class="property-group">
        <div class="group-header">
          <div class="group-icon">⚙️</div>
          <h3 class="group-title">Advanced Properties</h3>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Flex Direction</label>
            <select>
              <option>Row</option>
              <option>Column</option>
              <option>Row Reverse</option>
              <option>Column Reverse</option>
            </select>
          </div>
          <div class="input-group">
            <label>Justify Content</label>
            <select>
              <option>Flex Start</option>
              <option>Center</option>
              <option>Flex End</option>
              <option>Space Between</option>
              <option>Space Around</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Flex Wrap</label>
            <select>
              <option>No Wrap</option>
              <option>Wrap</option>
              <option>Wrap Reverse</option>
            </select>
          </div>
          <div class="input-group">
            <label>Flex Grow</label>
            <input type="text" placeholder="0">
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>Transform</label>
            <input type="text" placeholder="none">
          </div>
          <div class="input-group">
            <label>Transition</label>
            <input type="text" placeholder="none">
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
